<!DOCTYPE html>
<html>
<head>
    <title>Upload Note // ScribeNest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .field-select {
            width: 100%; padding: 14px; margin-bottom: 22px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25);
            color: white; outline: none;
        }
        [hidden] { display: none !important; }
        .field-select:disabled { opacity: .55; cursor: not-allowed; }
        .field-select option { color: #0f172a; }
        .field-file { width: 100%; margin-bottom: 8px; color: #cbd5e1; }
        .field-hint { font-size: .8rem; color: #94a3b8; margin-bottom: 22px; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: .9rem; }
        .flash.error { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); color: #fecaca; }
        .flash.success { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.5); color: #bbf7d0; }
    </style>
</head>
<body>

<nav class="dashboard-nav">
    <div class="logo">SCRIBENEST</div>
    <a href="{{ url_for('dashboard') }}">← Dashboard</a>
</nav>

<main class="editor">

    <p class="eyebrow">SCRIBENEST // UPLOAD NOTE</p>
    <h1>Upload a Note</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">

        <label>Topic name</label>
        <input type="text" name="title" placeholder="e.g. Process Scheduling" required>

        <label>Tags</label>
        <input type="text" name="tags" placeholder="os, scheduling, fcfs (separate with commas)">

        <label>Programme</label>
        <select name="program" id="program" class="field-select" required>
            <option value="">Select a programme</option>
            {% for group, names in programs.items() %}
                <optgroup label="{{ group }}">
                    {% for name in names %}
                        <option value="{{ name }}">{{ name }}</option>
                    {% endfor %}
                </optgroup>
            {% endfor %}
        </select>

        <label>Subject</label>
        <select name="subject" id="subject" class="field-select" required>
            <option value="">Select a programme first</option>
            {% for prog, categories in curricula.items() %}
                {% for category, subjects in categories.items() %}
                    {% for code, name in subjects %}
                        <option value="{{ code }}" data-program="{{ prog }}" data-category="{{ category }}">{{ code }} - {{ name }}</option>
                    {% endfor %}
                {% endfor %}
            {% endfor %}
        </select>
        <input type="text" name="subject_text" id="subjectText" maxlength="120"
               placeholder="Type the subject name, e.g. Thermodynamics" hidden disabled>

        <label>File</label>
        <input type="file" name="file" class="field-file" required
               accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.doc,.docx,.ppt,.pptx">
        <p class="field-hint">PDF, image, Word or PowerPoint. Maximum 20 MB.</p>

        <label class="checkbox">
            <input type="checkbox" name="is_public">
            Make this note public
        </label>

        <button class="primary-button" type="submit">UPLOAD NOTE</button>

    </form>

</main>

<script>
    // Programmes with a stored curriculum get a subject dropdown (grouped by category);
    // every other programme gets a box to type the subject.
    const programSelect = document.getElementById('program');
    const subjectSelect = document.getElementById('subject');
    const subjectText = document.getElementById('subjectText');
    const allSubjects = [...subjectSelect.querySelectorAll('option[data-program]')].map(o => ({
        value: o.value, text: o.textContent, program: o.dataset.program, category: o.dataset.category
    }));

    function updateSubject() {
        const chosen = programSelect.value;
        const list = allSubjects.filter(s => s.program === chosen);
        const typed = chosen !== '' && list.length === 0;

        subjectSelect.innerHTML = '';
        subjectSelect.add(new Option(chosen ? 'Select a subject' : 'Select a programme first', ''));

        const groups = {};
        list.forEach(s => {
            if (!groups[s.category]) {
                groups[s.category] = document.createElement('optgroup');
                groups[s.category].label = s.category;
                subjectSelect.appendChild(groups[s.category]);
            }
            groups[s.category].appendChild(new Option(s.text, s.value));
        });

        subjectSelect.hidden = typed;
        subjectSelect.disabled = typed || !chosen;
        subjectSelect.required = !typed;
        subjectText.hidden = !typed;
        subjectText.disabled = !typed;
        subjectText.required = typed;
    }

    programSelect.addEventListener('change', updateSubject);
    updateSubject();
</script>

</body>
</html>
