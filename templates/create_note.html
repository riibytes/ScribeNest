<!DOCTYPE html>
<html>
<head>

    <title>Create Note // ScribeNest</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav class="dashboard-nav">

    <div class="logo">
        SCRIBENEST
    </div>

    <a href="{{ url_for('dashboard') }}">
        ← Dashboard
    </a>

</nav>


<main class="editor">

    <p class="eyebrow">
        SCRIBENEST // NEW NOTE
    </p>

    <h1>
        Create a Note
    </h1>


    <form method="POST">

        <label>
            Title
        </label>

        <input
            type="text"
            name="title"
            placeholder="e.g. Process Scheduling"
            required
        >


        <label>
            Subject
        </label>

        <input
            type="text"
            name="subject"
            placeholder="e.g. Operating Systems"
            required
        >


        <label>
            Program / Branch
        </label>

        <select name="program" style="width: 100%; padding: 14px; margin-bottom: 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25); color: white; outline: none;">
            <option value="">-- Select Your Program --</option>
            {% for category, progs in programs.items() %}
                <optgroup label="{{ category }}">
                    {% for prog in progs %}
                        <option value="{{ prog }}">{{ prog }}</option>
                    {% endfor %}
                </optgroup>
            {% endfor %}
        </select>


        <label>
            Tags
        </label>

        <input
            type="text"
            name="tags"
            placeholder="os, scheduling, fcfs"
        >


        <label>
            Content
        </label>

        <textarea
            name="content"
            rows="18"
            placeholder="Write your notes here..."
            required
        ></textarea>


        <label class="checkbox">

            <input
                type="checkbox"
                name="is_public"
            >

            Make this note public

        </label>


        <button
            class="primary-button"
            type="submit"
        >
            SAVE NOTE
        </button>

    </form>

</main>

</body>
</html>
