<!DOCTYPE html>
<html>
<head>
    <title>Login // ScribeNest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="logo">SCRIBENEST</div>

        <p class="subtitle">
            YOUR ACADEMIC KNOWLEDGE HUB
        </p>

        <h1>Welcome Back</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <!-- GOOGLE OAUTH LOGIN BUTTON -->
        <a 
            href="{{ url_for('google_login') }}" 
            style="display: block; text-align: center; width: 100%; padding: 14px; margin-top: 15px; border-radius: 10px; background: white; color: #1e293b; font-weight: bold; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box;"
        >
            🔵 Continue with Google
        </a>

        <p class="switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

        <a
            class="back"
            href="{{ url_for('home') }}"
        >
            ← Back to ScribeNest
        </a>

    </div>

</div>

</body>
</html>
