<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScribeNest // VIT Bhopal</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .brand {
            color: #2563eb;
        }

        .subtitle {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #666;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        footer {
            margin-top: 60px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            <span class="brand">ScribeNest</span>
        </h1>

        <div class="subtitle">
            VIT Bhopal
        </div>

        <div class="card-container">

            <div class="card">
                <h2>Notes</h2>
                <p>
                    Create, organize and access study notes
                    in one place.
                </p>

                <a href="{{ url_for('dashboard') }}" class="btn">
                    Explore Notes
                </a>
            </div>

            <div class="card">
                <h2>Vault</h2>
                <p>
                    Store and manage your academic documents
                    securely.
                </p>

                <a href="{{ url_for('dashboard') }}" class="btn">
                    Open Vault
                </a>
            </div>

            <div class="card">
                <h2>AI Tools</h2>
                <p>
                    Use AI-powered tools to make studying
                    easier and more efficient.
                </p>

                <a href="{{ url_for('dashboard') }}" class="btn">
                    AI Tools
                </a>
            </div>

        </div>

        <footer>
            © 2026 ScribeNest // VIT Bhopal
        </footer>

    </div>

</body>
</html>
